name: Refresh profile README

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - render.py
      - info.json
      - template.md
      - .github/workflows/refresh-profile.yml
      - tests/**

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check generator and tests
        run: |
          python -m py_compile render.py
          python -m unittest discover -s tests
      - name: Refresh biography, projects and statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python render.py
          python - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          readme = Path('README.md').read_text()
          summary = re.search(r'<summary>(.*?)</summary>', readme).group(1)
          count = len(re.findall(r'^\* \[', readme, re.MULTILINE))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(f'{summary}\n\n{count} projects refreshed.\n')
          PYTHON
      - name: Publish changed README
        run: |
          git diff --check
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh profile from public sources'
          git push
